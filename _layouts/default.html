<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  {%- assign desc = page.subtitle | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 180 %}
  <meta name="description" content="{{ desc | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ desc | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  <meta name="theme-color" content="#ffffff">
  <link rel="preload" href="{{ '/assets/fonts/EBGaramond.woff' | relative_url }}" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="nav" aria-label="Site">
      <form class="search" action="{{ '/' | relative_url }}" method="get" role="search">
        <label class="visually-hidden" for="q">Search {{ site.title }}</label>
        <input id="q" name="q" type="search" placeholder="Search titles, tags, dates" autocomplete="off">
      </form>
      <a class="nav-btn" href="{{ '/updates/' | relative_url }}"{% if page.url == '/updates/' %} aria-current="page"{% endif %}>Updates</a>
    </nav>
  </header>

  <main class="main">
    {{ content }}
  </main>

  <footer class="foot">
    <div class="foot-row">
      <a class="gh" href="{{ site.github }}" rel="me noopener" aria-label="GitHub">{% include github.svg %}<span>GitHub</span></a>
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author }}. All rights reserved.</p>
    </div>
  </footer>

  <script>
    // Search every project (not just this page), using search.json.
    (function () {
      var q = document.getElementById('q');
      var results = document.getElementById('results');
      var listing = document.querySelector('[data-listing]');
      var data = null;

      function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      function render(term) {
        if (!results) return;
        var f = term.trim().toLowerCase();
        if (!f) { results.hidden = true; if (listing) listing.hidden = false; return; }
        var hits = data.filter(function (p) { return (p.title + ' ' + p.tags + ' ' + p.date).toLowerCase().indexOf(f) !== -1; });
        results.innerHTML = hits.length
          ? hits.map(function (p) {
              return '<li><a class="entry" href="' + esc(p.url) + '"><span class="e-title">' + esc(p.title) +
                     '</span><span class="meta"><time>' + esc(p.date) + '</time><span>' + esc(p.read) + '</span><span>' + esc(p.author) + '</span></span></a></li>';
            }).join('')
          : '<li class="none">Nothing found for “' + esc(term) + '”.</li>';
        results.hidden = false; if (listing) listing.hidden = true;
      }
      function load(cb) {
        if (data) return cb();
        fetch('{{ "/search.json" | relative_url }}').then(function (r) { return r.json(); })
          .then(function (d) { data = d; cb(); }).catch(function () { data = []; cb(); });
      }

      if (!results) return;       // on a project page, Enter opens the home page with your search
      q.form.addEventListener('submit', function (e) { e.preventDefault(); });
      q.addEventListener('input', function () { load(function () { render(q.value); }); });
      var param = new URLSearchParams(location.search).get('q');
      if (param) { q.value = param; load(function () { render(param); }); }
    })();
  </script>
</body>
</html>
